<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>faq-accordion</title>
	<meta name="description" content="JS練習用のページです。">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>

	<main>
		<section>
			<h2>FAQ</h2>
			<div id="accordion">
				<dl>
					<div class="accordion-item">
						<dt class="accordion-question">対応可能な制作物を教えてください。</dt>
						<dd class="accordion-answer">
							<p>ランディングページ・コーポレートサイトのコーディングに対応しております。デザインデータ（Figma）をご支給いただければ、HTML・CSS・JavaScriptでの実装が可能です。</p>
						</dd>
					</div>
					<div class="accordion-item">
						<dt class="accordion-question">納期はどのくらいかかりますか？</dt>
						<dd class="accordion-answer">
							<p>ページ規模によって異なりますが、ランディングページ1枚であれば約1週間〜10日を目安としております。詳細はお気軽にご相談ください。</p>
						</dd>
					</div>
					<div class="accordion-item">
						<dt class="accordion-question">修正対応はしていただけますか？</dt>
						<dd class="accordion-answer">
							<p>納品後も修正対応を承っております。修正回数や期間についてはご依頼内容に応じてご相談ください。</p>
						</dd>
					</div>
				</dl>
			</div>
		</section>

	</main>

	<script src="js/script.js"></script>
</body>

</html>
