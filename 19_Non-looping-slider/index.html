<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Non-looping slider</title>
	<meta name="description" content="JS練習用のページです。">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>

	<main>
		<section>
			<h2>カルーセル（スライダー）ループ表示なし</h2>
			<div class="stage">
				<ul class="slider-list">
					<li class="slide">スライド 1</li>
					<li class="slide">スライド 2</li>
					<li class="slide">スライド 3</li>
				</ul>
			</div>
			<div class="controls">
				<button id="prev">← 前へ</button>
				<button id="next">次へ →</button>
			</div>
		</section>

	</main>

	<script src="js/script.js"></script>
</body>

</html>
