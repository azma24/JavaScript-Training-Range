<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>tab-switch</title>
	<meta name="description" content="JS練習用のページです。">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>

	<main>
		<section>
			<h2>タブで切り替える</h2>
			<button class="tab-btn">メニュー</button>
			<button class="tab-btn">アクセス</button>
			<button class="tab-btn">予約</button>

			<div class="tab-body">
				<h3>メニューの内容</h3>
				<p>メニューの内容です。</p>
			</div>
			<div class="tab-body">
				<h3>アクセスの内容</h3>
				<p>アクセスの内容です。</p>
			</div>
			<div class="tab-body">
				<h3>予約の内容</h3>
				<p>予約の内容です。</p>
			</div>
		</section>

	</main>

	<script src="js/script.js"></script>
</body>

</html>
